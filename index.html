<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overhead</title>
</head>
<body>
<style>
:root {
  --void:        #05070d;
  --void-2:      #0a0e18;
  --panel:       rgba(11, 15, 25, 0.82);
  --panel-solid: #0b0f19;
  --edge:        rgba(186, 202, 238, 0.15);
  --edge-strong: rgba(186, 202, 238, 0.30);
  --ink:         #e9eaf2;
  --dim:         #8d95af;
  --dimmer:      #5d6580;
  --brass:       #d9a441;
  --brass-soft:  rgba(217, 164, 65, 0.16);
  --cool:        #6fa8cf;
  --shadow:      0 18px 48px rgba(0, 0, 0, 0.6);
  --serif:       "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans:        system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:        ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button, input, select {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ---------- stage ---------- */

/* viewport units rather than a height:100% chain — the host page owns the
   ancestors and may not pass a height down */
#stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: var(--void);
}

#sky {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  touch-action: none;
  cursor: grab;
}

#sky.dragging { cursor: grabbing; }

/* ---------- shared chrome ---------- */

.rail {
  position: fixed;
  z-index: 10;
  background: var(--panel);
  border: 1px solid var(--edge);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  box-shadow: var(--shadow);
}

.label {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dimmer);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- masthead ---------- */

#masthead {
  top: 14px;
  left: 14px;
  padding: 12px 16px 13px;
  border-radius: 2px;
  max-width: min(340px, calc(100vw - 28px));
  display: flex;
  flex-direction: column;
  gap: 9px;
}

#masthead h1 {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 400;
  letter-spacing: 0.015em;
  margin: 0;
  line-height: 1;
}

#masthead h1 em {
  font-style: normal;
  color: var(--brass);
}

.crest {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--edge);
}

.crest .label { padding-bottom: 2px; }

#readout {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 12px;
  align-items: baseline;
}

#readout .label { text-align: left; }

#readout .val {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#readout .val.soft { color: var(--dim); }

#skyphase {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--dim);
}

#skyphase .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cool);
  box-shadow: 0 0 8px currentColor;
  flex: none;
}

/* ---------- control deck ---------- */

#deck {
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: min(760px, calc(100vw - 28px));
  border-radius: 2px;
  padding: 11px 13px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.deck-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.deck-row.divider {
  padding-top: 10px;
  border-top: 1px solid var(--edge);
}

.spacer { flex: 1 1 auto; }

.btn {
  appearance: none;
  background: transparent;
  border: 1px solid var(--edge);
  border-radius: 2px;
  padding: 6px 11px;
  font-size: 12px;
  letter-spacing: 0.01em;
  color: var(--dim);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.btn:hover {
  color: var(--ink);
  border-color: var(--edge-strong);
  background: rgba(186, 202, 238, 0.05);
}

.btn[aria-pressed="true"] {
  color: var(--brass);
  border-color: rgba(217, 164, 65, 0.5);
  background: var(--brass-soft);
}

.btn.icon {
  padding: 6px 9px;
  font-family: var(--mono);
  min-width: 34px;
  text-align: center;
}

.btn.solid {
  color: var(--void);
  background: var(--brass);
  border-color: var(--brass);
  font-weight: 600;
}

.btn.solid:hover { background: #eab554; color: var(--void); }

.seg {
  display: inline-flex;
  border: 1px solid var(--edge);
  border-radius: 2px;
  overflow: hidden;
}

.seg .btn {
  border: 0;
  border-right: 1px solid var(--edge);
  border-radius: 0;
}

.seg .btn:last-child { border-right: 0; }

.field {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--edge);
  border-radius: 2px;
  padding: 4px 9px;
}

.field input,
.field select {
  background: transparent;
  border: 0;
  padding: 0;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  min-width: 0;
}

.field select option { background: var(--panel-solid); }
.field input:focus, .field select:focus { outline: none; }
.field input::placeholder { color: var(--dimmer); }
.field:focus-within { border-color: var(--edge-strong); }

#searchfield { flex: 1 1 190px; max-width: 280px; }
#searchfield input { width: 100%; }

#lat, #lon { width: 62px; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  width: 108px;
  height: 16px;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--edge-strong);
}

input[type="range"]::-moz-range-track {
  height: 2px;
  background: var(--edge-strong);
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--brass);
  border: 0;
}

input[type="range"]::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--brass);
  border: 0;
}

/* ---------- dossier ---------- */

#dossier {
  top: 14px;
  right: 14px;
  width: 268px;
  border-radius: 2px;
  padding: 13px 15px 14px;
  display: none;
  flex-direction: column;
  gap: 11px;
}

#dossier.open { display: flex; }

.dossier-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

#dsname {
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1.1;
  margin: 0 0 3px;
  font-weight: 400;
  text-wrap: balance;
}

#dskind {
  font-size: 11px;
  color: var(--brass);
  letter-spacing: 0.06em;
}

#dsclose {
  flex: none;
  background: transparent;
  border: 0;
  color: var(--dimmer);
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1;
  padding: 2px 4px;
  cursor: pointer;
}

#dsclose:hover { color: var(--ink); }

#dstable {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  align-items: baseline;
  border-top: 1px solid var(--edge);
  padding-top: 11px;
}

#dstable .v {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  text-align: right;
}

#dsnote {
  font-size: 11.5px;
  color: var(--dim);
  line-height: 1.5;
  border-top: 1px solid var(--edge);
  padding-top: 10px;
}

.horizon-chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.chip-up   { background: rgba(111, 168, 207, 0.16); color: #8fc3e4; }
.chip-down { background: rgba(186, 202, 238, 0.08); color: var(--dimmer); }

/* ---------- toast ---------- */

#toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 172px;
  transform: translate(-50%, 8px);
  background: var(--panel-solid);
  border: 1px solid var(--edge-strong);
  border-radius: 2px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--ink);
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}

#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- thumb controls ----------
   These sit above the responsive block on purpose. A media query carries no extra
   specificity, so anything defined after it would win at every width and the
   buttons would stay hidden on the phones they exist for. */

#decktoggle,
#arbtn {
  display: none;
  position: fixed;
  z-index: 12;
  bottom: 14px;
  right: 14px;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  color: var(--ink);
  padding: 11px 16px;
}

#arbtn {
  right: auto;
  left: 14px;
}

#arbtn[aria-pressed="true"] {
  background: var(--ink);
  color: var(--void);
}

@supports (padding: max(0px)) {
  #decktoggle, #arbtn { bottom: max(14px, env(safe-area-inset-bottom)); }
}

/* ---------- responsive ----------
   Keyed on height as well as width: a phone turned on its side is about 844px
   wide, so a width-only breakpoint hands it the desktop layout and takes the
   thumb buttons away again at exactly the moment they are being held. */

@media (max-width: 720px), (max-height: 520px) {
  #masthead { padding: 10px 13px 11px; max-width: calc(100vw - 28px); }
  #masthead h1 { font-size: 22px; }
  #readout { grid-template-columns: auto 1fr; }
  #dossier {
    top: auto;
    bottom: 68px;
    right: 14px;
    left: 14px;
    width: auto;
  }
  #deck { display: none; }
  #deck.open { display: flex; }
  #decktoggle { display: inline-flex; }
  #arbtn { display: inline-flex; }
  #toast { bottom: 110px; }
}

/* short viewports have roughly 390px of height to spend, and the deck alone can
   ask for more than that, so anything that opens has to be able to scroll */
@media (max-height: 520px) {
  #masthead {
    padding: 7px 11px 8px;
    gap: 5px;
    max-width: min(300px, calc(100vw - 28px));
  }
  #masthead h1 { font-size: 17px; }
  #readout { font-size: 11px; row-gap: 2px; }
  #deck {
    max-height: calc(100vh - 76px);
    max-height: calc(100dvh - 76px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #dossier {
    max-height: calc(100vh - 96px);
    max-height: calc(100dvh - 96px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* landscape puts the notch on one edge, and fixed panels sit under it */
  @supports (padding: max(0px)) {
    #masthead { left: max(14px, env(safe-area-inset-left)); }
    #dossier { right: max(14px, env(safe-area-inset-right)); }
    #decktoggle { right: max(14px, env(safe-area-inset-right)); }
    #arbtn { left: max(14px, env(safe-area-inset-left)); }
  }
}

/* the deck covers the screen when open, so the pointing button steps aside;
   browsers without :has() simply keep both, which is harmless */
body:has(#deck.open) #arbtn { display: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}

</div>

<header id="masthead" class="rail">
  <div class="crest">

  </div>

  </div>
  <div id="skyphase"><span class="dot"></span><span id="rdphase">—</span></div>
</header>

<section id="dossier" class="rail" aria-live="polite">
  <div class="dossier-head">
    <div>
      <h2 id="dsname">—</h2>
      <div id="dskind">—</div>
    </div>
    <button id="dsclose" aria-label="Close details">&times;</button>
  </div>
  <div id="dstable"></div>
  <div id="dsnote"></div>
</section>

<button id="decktoggle" class="btn rail" aria-expanded="false">Controls</button>
<button id="arbtn" class="btn rail" aria-pressed="false" title="Use device orientation to point at the sky">Point at sky</button>

<div id="deck" class="rail">
  <div class="deck-row">
    <div class="seg" role="group" aria-label="View mode">
      <button class="btn" id="mdome" aria-pressed="true">Dome</button>
      <button class="btn" id="mscope" aria-pressed="false">Scope</button>
    </div>
    <button class="btn" id="btilt" aria-pressed="false" title="Use device orientation to point at the sky">Point at sky</button>
    <div class="field" id="searchfield">
      <span class="label">Find</span>
      <input id="search" list="objectlist" placeholder="Vega, Saturn, M31…" autocomplete="off" aria-label="Find an object">
      <datalist id="objectlist"></datalist>
    </div>
    <span class="spacer"></span>
    <button class="btn solid" id="bhere">Use my location</button>
  </div>

  <div class="deck-row divider">

    <div class="seg" role="group" aria-label="Time rate">
      <button class="btn" data-rate="1" aria-pressed="true">1&times;</button>
      <button class="btn" data-rate="60" aria-pressed="false">1m/s</button>
      <button class="btn" data-rate="3600" aria-pressed="false">1h/s</button>
      <button class="btn" data-rate="86400" aria-pressed="false">1d/s</button>
    </div>
    <button class="btn" id="bnow">Now</button>
    <span class="spacer"></span>
    <div class="field">

    </div>
    <div class="field">
      <select id="preset" aria-label="Preset location">
        <option value="">City…</option>
      </select>
    </div>
  </div>

  <div class="deck-row divider">
    <button class="btn" data-layer="lines" aria-pressed="true">Figures</button>
    <button class="btn" data-layer="names" aria-pressed="true">Names</button>
    <button class="btn" data-layer="milkyway" aria-pressed="true">Milky Way</button>
    <button class="btn" data-layer="planets" aria-pressed="true">Planets</button>
    <button class="btn" data-layer="deep" aria-pressed="true">Deep sky</button>
    <button class="btn" data-layer="grid" aria-pressed="false">Grid</button>
    <button class="btn" data-layer="ecliptic" aria-pressed="false">Ecliptic</button>
    <button class="btn" data-layer="realsky" aria-pressed="false" title="Let daylight and twilight wash out the stars">Real sky</button>
    <span class="spacer"></span>
    <div class="field">
      <span class="label">Limit mag</span>
      <input type="range" id="limmag" min="3" max="6.5" step="0.1" value="5.6" aria-label="Limiting magnitude">
      <span class="num" id="limmagval" style="font-size:12px;width:26px;text-align:right">5.6</span>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

/* ============================================================
   Astronomy
   ============================================================ */
const D2R = Math.PI / 180, R2D = 180 / Math.PI, TAU = Math.PI * 2;
const sin = a => Math.sin(a * D2R), cos = a => Math.cos(a * D2R), tan = a => Math.tan(a * D2R);
const rev = a => ((a % 360) + 360) % 360;

function julian(ms) { return ms / 86400000 + 2440587.5; }

function gmst(jd) {
  const d = jd - 2451545.0, T = d / 36525;
  return rev(280.46061837 + 360.98564736629 * d + 0.000387933 * T * T - T * T * T / 38710000);
}

/* equatorial (RA hours, Dec deg) -> horizontal (alt deg, az deg from N through E) */
function horizontal(raH, decD, lstDeg, latD) {
  const H = rev(lstDeg - raH * 15);
  const sd = sin(decD), cd = cos(decD), sp = sin(latD), cp = cos(latD), cH = cos(H), sH = sin(H);
  const alt = Math.asin(sd * sp + cd * cp * cH) * R2D;
  const az = rev(Math.atan2(-cd * sH, sd * cp - cd * sp * cH) * R2D);
  return [alt, az];
}

/* ecliptic (lon, lat, deg) -> equatorial [RA hours, Dec deg] */
function eclToEq(lon, lat, obl) {
  const x = cos(lat) * cos(lon);
  const y = cos(lat) * sin(lon) * cos(obl) - sin(lat) * sin(obl);
  const z = cos(lat) * sin(lon) * sin(obl) + sin(lat) * cos(obl);
  return [rev(Math.atan2(y, x) * R2D) / 15, Math.atan2(z, Math.hypot(x, y)) * R2D];
}

/* Schlyter low-precision ephemeris. d = days since 2000 Jan 0.0 TDT */
function dayNumber(jd) { return jd - 2451543.5; }

function eccAnomaly(M, e) {
  const eD = e * R2D;
  let E = M + eD * sin(M) * (1 + e * cos(M));
  for (let i = 0; i < 6; i++) {
    const dE = (E - eD * sin(E) - M) / (1 - e * cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-6) break;
  }
  return E;
}

/* Schlyter's mean Sun, referred to the equinox of date. Used only to drive the
   lunar perturbation terms and the Moon's elongation, which live in that frame. */
function sunOfDate(d) {
  const w = 282.9404 + 4.70935e-5 * d;
  const e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.0470 + 0.9856002585 * d);
  const E = M + e * R2D * sin(M) * (1 + e * cos(M));
  const xv = cos(E) - e, yv = Math.sqrt(1 - e * e) * sin(E);
  const r = Math.hypot(xv, yv);
  const lon = rev(Math.atan2(yv, xv) * R2D + w);
  return { lon, r, M, w };
}

/* JPL "Keplerian Elements for Approximate Positions of the Major Planets",
   1800-2050 set: [a, e, i, L, longitude of perihelion, longitude of node] and
   per-century rates, referred to the J2000 ecliptic — the same frame as the
   star catalogue above, so planets land among the right stars. */
const JPL = {
  Mercury: [[0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593],
            [0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081]],
  Venus:   [[0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255],
            [0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418]],
  Earth:   [[1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0],
            [0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0]],
  Mars:    [[1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891],
            [0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343]],
  Jupiter: [[5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909],
            [-0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106]],
  Saturn:  [[9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448],
            [-0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794]],
  Uranus:  [[19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503],
            [-0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589]],
  Neptune: [[30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574],
            [0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664]]
};

const PLANET_NAMES = ["Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"];
const OBL_J2000 = 23.4392911;

/* heliocentric rectangular coordinates, J2000 ecliptic, AU */
function helio(name, jd) {
  const T = (jd - 2451545.0) / 36525, el = JPL[name];
  const a = el[0][0] + el[1][0] * T, e = el[0][1] + el[1][1] * T;
  const i = el[0][2] + el[1][2] * T, L = el[0][3] + el[1][3] * T;
  const peri = el[0][4] + el[1][4] * T, node = el[0][5] + el[1][5] * T;
  const w = peri - node;
  const M = ((L - peri) % 360 + 540) % 360 - 180;
  let E = M + R2D * e * sin(M);
  for (let k = 0; k < 10; k++) {
    const dE = (M - (E - R2D * e * sin(E))) / (1 - e * cos(E));
    E += dE;
    if (Math.abs(dE) < 1e-9) break;
  }
  const xp = a * (cos(E) - e), yp = a * Math.sqrt(1 - e * e) * sin(E);
  const cw = cos(w), sw = sin(w), cn = cos(node), sn = sin(node), ci = cos(i), si = sin(i);
  return [
    (cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp,
    (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp,
    (sw * si) * xp + (cw * si) * yp
  ];
}

const PLANET_LOOK = {
  Mercury: ["#c8c2b6", -0.36, "Never far from the Sun — catch it in twilight or not at all."],
  Venus:   ["#f5e6c0", -4.34, "The brightest point of light in the sky, wrapped in reflective cloud."],
  Mars:    ["#e08560", -1.51, "Its colour is literal rust — iron oxide dust over the whole surface."],
  Jupiter: ["#e8d9b8", -9.25, "Four moons swing around it, visible in steady binoculars."],
  Saturn:  ["#e6d29a", -8.88, "Rings need about 25x magnification before they resolve."],
  Uranus:  ["#a8dbdb", -7.15, "Just at the naked-eye limit under a dark sky, if you know exactly where to look."],
  Neptune: ["#7f9de0", -6.90, "Never visible without optics — found by mathematics before it was seen."]
};

/* geocentric Sun, J2000 ecliptic — simply the reverse of Earth's orbit */
function sunPos(jd) {
  const e = helio("Earth", jd);
  const x = -e[0], y = -e[1], z = -e[2];
  return { lon: rev(Math.atan2(y, x) * R2D), lat: Math.atan2(z, Math.hypot(x, y)) * R2D,
           r: Math.hypot(x, y, z) };
}

function planetPos(name, jd) {
  const p = helio(name, jd), e = helio("Earth", jd);
  const xg = p[0] - e[0], yg = p[1] - e[1], zg = p[2] - e[2];
  const dist = Math.hypot(xg, yg, zg);
  const r = Math.hypot(p[0], p[1], p[2]);
  const R = Math.hypot(e[0], e[1], e[2]);
  const glon = rev(Math.atan2(yg, xg) * R2D);
  const glat = Math.atan2(zg, Math.hypot(xg, yg)) * R2D;

  /* phase angle and magnitude */
  let cosFV = (r * r + dist * dist - R * R) / (2 * r * dist);
  cosFV = Math.max(-1, Math.min(1, cosFV));
  const FV = Math.acos(cosFV) * R2D;
  const base = PLANET_LOOK[name][1];
  let mag = base + 5 * Math.log10(r * dist);
  if (name === "Mercury") mag += 0.027 * FV + 2.2e-13 * Math.pow(FV, 6);
  else if (name === "Venus") mag += 0.013 * FV + 4.2e-7 * Math.pow(FV, 3);
  else if (name === "Mars") mag += 0.016 * FV;
  else if (name === "Jupiter") mag += 0.014 * FV;
  else mag += 0.001 * FV;

  return { lon: glon, lat: glat, dist, mag, phase: (1 + cosFV) / 2 };
}

function moonPos(d, sun) {
  const N = rev(125.1228 - 0.0529538083 * d), i = 5.1454;
  const w = rev(318.0634 + 0.1643573223 * d), a = 60.2666, e = 0.054900;
  const M = rev(115.3654 + 13.0649929509 * d);
  const E = eccAnomaly(M, e);
  const xv = a * (cos(E) - e), yv = a * Math.sqrt(1 - e * e) * sin(E);
  const r0 = Math.hypot(xv, yv), v = rev(Math.atan2(yv, xv) * R2D);
  const u = v + w;
  const xe = r0 * (cos(N) * cos(u) - sin(N) * sin(u) * cos(i));
  const ye = r0 * (sin(N) * cos(u) + cos(N) * sin(u) * cos(i));
  const ze = r0 * sin(u) * sin(i);

  let lon = rev(Math.atan2(ye, xe) * R2D);
  let lat = Math.atan2(ze, Math.hypot(xe, ye)) * R2D;
  let r = Math.sqrt(xe * xe + ye * ye + ze * ze);

  const Ls = rev(sun.M + sun.w), Lm = rev(N + w + M);
  const D = rev(Lm - Ls), F = rev(Lm - N), Ms = sun.M, Mm = M;

  lon += -1.274 * sin(Mm - 2 * D) + 0.658 * sin(2 * D) - 0.186 * sin(Ms)
       - 0.059 * sin(2 * Mm - 2 * D) - 0.057 * sin(Mm - 2 * D + Ms) + 0.053 * sin(Mm + 2 * D)
       + 0.046 * sin(2 * D - Ms) + 0.041 * sin(Mm - Ms) - 0.035 * sin(D)
       - 0.031 * sin(Mm + Ms) - 0.015 * sin(2 * F - 2 * D) + 0.011 * sin(Mm - 4 * D);
  lat += -0.173 * sin(F - 2 * D) - 0.055 * sin(Mm - F - 2 * D) - 0.046 * sin(Mm + F - 2 * D)
       + 0.033 * sin(F + 2 * D) + 0.017 * sin(2 * Mm + F);
  r += -0.58 * cos(Mm - 2 * D) - 0.46 * cos(2 * D);

  /* elongation and phase are frame-independent, so take them before precessing */
  const elong = Math.acos(Math.max(-1, Math.min(1, cos(lat) * cos(lon - sun.lon)))) * R2D;
  const illum = (1 + cos(180 - elong)) / 2;
  const waxing = rev(lon - sun.lon) < 180;

  /* Schlyter's lunar theory is referred to the equinox of date; shift it back to
     J2000 by the general precession in longitude so it agrees with the stars */
  const T = (d - 1.5) / 36525;
  lon -= 1.396888 * T + 0.0003086 * T * T;

  return { lon: rev(lon), lat, dist: r, illum, elong, waxing };
}

/* galactic -> equatorial basis (J2000) */
const GAL = (() => {
  const v = (raH, dec) => [cos(dec) * cos(raH * 15), cos(dec) * sin(raH * 15), sin(dec)];
  const P = v(12.85632, 27.12825);          // north galactic pole
  const C = v(17.76033, -28.93617);         // galactic centre, l=0 b=0
  const Y = [P[1] * C[2] - P[2] * C[1], P[2] * C[0] - P[0] * C[2], P[0] * C[1] - P[1] * C[0]];
  return { P, C, Y };
})();

function galToEq(l, b) {
  const cb = cos(b), sb = sin(b), cl = cos(l), sl = sin(l);
  const x = cb * cl * GAL.C[0] + cb * sl * GAL.Y[0] + sb * GAL.P[0];
  const y = cb * cl * GAL.C[1] + cb * sl * GAL.Y[1] + sb * GAL.P[1];
  const z = cb * cl * GAL.C[2] + cb * sl * GAL.Y[2] + sb * GAL.P[2];
  return [rev(Math.atan2(y, x) * R2D) / 15, Math.atan2(z, Math.hypot(x, y)) * R2D];
}

/* ============================================================
   Colour
   ============================================================ */
const BV_STOPS = [
  [-0.35, [150, 175, 255]], [0.00, [200, 214, 255]], [0.30, [248, 247, 255]],
  [0.60, [255, 244, 232]], [1.00, [255, 212, 165]], [1.50, [255, 182, 133]],
  [2.00, [255, 152, 112]]
];

function bvColor(bv) {
  let a = BV_STOPS[0], b = BV_STOPS[BV_STOPS.length - 1];
  for (let i = 0; i < BV_STOPS.length - 1; i++) {
    if (bv >= BV_STOPS[i][0] && bv <= BV_STOPS[i + 1][0]) { a = BV_STOPS[i]; b = BV_STOPS[i + 1]; break; }
  }
  if (bv < BV_STOPS[0][0]) return BV_STOPS[0][1];
  if (bv > BV_STOPS[BV_STOPS.length - 1][0]) return BV_STOPS[BV_STOPS.length - 1][1];
  const t = (bv - a[0]) / (b[0] - a[0] || 1);
  return [0, 1, 2].map(i => Math.round(a[1][i] + (b[1][i] - a[1][i]) * t));
}

/* ============================================================
   Scene computation
   ============================================================ */
const starIndex = {};
STARS.forEach(s => { starIndex[s[0]] = s; });

let scene = null;

function buildScene() {
  const jd = julian(S.time), lst = rev(gmst(jd) + S.lon), d = dayNumber(jd);
  const obl = OBL_J2000;
  const sun = sunPos(jd);

  const sunEq = eclToEq(sun.lon, sun.lat, obl);
  const sunH = horizontal(sunEq[0], sunEq[1], lst, S.lat);

  const objects = [];

  for (const s of STARS) {
    const [alt, az] = horizontal(s[2], s[3], lst, S.lat);
    objects.push({ t: "star", key: s[0], name: s[1], ra: s[2], dec: s[3], mag: s[4], bv: s[5], alt, az });
  }

  const bodies = [];
  bodies.push({ t: "sun", name: "Sun", ra: sunEq[0], dec: sunEq[1], mag: -26.7, alt: sunH[0], az: sunH[1],
                note: "Our star, 8 light-minutes away. Never look at it through optics." });

  const mp = moonPos(d, sunOfDate(d));
  const moonEq = eclToEq(mp.lon, mp.lat, obl);
  const moonH = horizontal(moonEq[0], moonEq[1], lst, S.lat);
  const pa = 180 - mp.elong;               // phase angle, degrees
  const moonMag = -12.73 + 0.026 * Math.abs(pa) + 4e-9 * Math.pow(Math.abs(pa), 4);
  bodies.push({ t: "moon", name: "Moon", ra: moonEq[0], dec: moonEq[1], mag: moonMag,
                alt: moonH[0], az: moonH[1], illum: mp.illum, waxing: mp.waxing, distER: mp.dist,
                note: moonPhaseName(mp) + " — " + Math.round(mp.illum * 100) + "% lit, " +
                      Math.round(mp.dist * 6371).toLocaleString() + " km away." });

  for (const name of PLANET_NAMES) {
    const p = planetPos(name, jd);
    const eq = eclToEq(p.lon, p.lat, obl);
    const h = horizontal(eq[0], eq[1], lst, S.lat);
    bodies.push({ t: "planet", name, ra: eq[0], dec: eq[1], mag: p.mag, alt: h[0], az: h[1],
                  dist: p.dist, note: PLANET_LOOK[name][2], color: PLANET_LOOK[name][0] });
  }

  const deep = DEEP.map(o => {
    const h = horizontal(o[2], o[3], lst, S.lat);
    return { t: "deep", name: o[0], kind: o[1], ra: o[2], dec: o[3], mag: o[4], note: o[5], alt: h[0], az: h[1] };
  });

  scene = { jd, lst, d, obl, sun, sunAlt: sunH[0], objects, bodies, deep };
  return scene;
}

function moonPhaseName(mp) {
  const i = mp.illum;
  if (i < 0.04) return "New Moon";
  if (i > 0.96) return "Full Moon";
  if (Math.abs(i - 0.5) < 0.06) return mp.waxing ? "First Quarter" : "Last Quarter";
  if (mp.waxing) return i < 0.5 ? "Waxing Crescent" : "Waxing Gibbous";
  return i < 0.5 ? "Waning Crescent" : "Waning Gibbous";
}

/* darkness: 0 = full daylight, 1 = astronomical night */
function darkness(sunAlt) {
  if (sunAlt >= 0) return 0;
  if (sunAlt <= -18) return 1;
  const t = -sunAlt / 18;
  return t * t * (3 - 2 * t) * 0.999;
}

function phaseLabel(sunAlt) {
  if (sunAlt > 0) return ["Daylight — Sun " + sunAlt.toFixed(0) + "° up", "#8fbde8"];
  if (sunAlt > -6) return ["Civil twilight", "#c98f5a"];
  if (sunAlt > -12) return ["Nautical twilight", "#7b7fb8"];
  if (sunAlt > -18) return ["Astronomical twilight", "#4a5688"];
  return ["Night — Sun " + Math.abs(sunAlt).toFixed(0) + "° below", "#6fa8cf"];
}

/* ============================================================
   Projection
   ============================================================ */
const cv = document.getElementById("sky");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

/* Measure defensively: a host page can lay this out before the canvas has a box,
   and a zero-width canvas yields a negative dome radius, which canvas rejects. */
function measure() {
  const r = cv.getBoundingClientRect();
  let w = Math.round(r.width) || cv.clientWidth || 0;
  let h = Math.round(r.height) || cv.clientHeight || 0;
  const root = document.documentElement || {};
  if (w < 2) w = window.innerWidth || root.clientWidth || 800;
  if (h < 2) h = window.innerHeight || root.clientHeight || 600;
  return [w, h];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const [w, h] = measure();
  if (w === W && h === H && cv.width) return;
  W = w; H = h;
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function view() {
  const span = Math.max(4, Math.min(W, H));
  if (S.mode === "dome") {
    return { mode: "dome", cx: W / 2, cy: H / 2, R: Math.max(2, span / 2 - 30), spin: S.spin };
  }
  const scale = (span / 2) / Math.tan(S.fov / 2 * D2R);
  /* pointing at the sky: take the phone's own axes, so the picture rolls with the
     handset and stays sane at the zenith, where alt/az alone would gimbal-lock */
  if (S.tilt && S.dev) {
    return { mode: "scope", cx: W / 2, cy: H / 2, scale, F: S.dev.F, Rv: S.dev.Rv, U: S.dev.U };
  }
  const F = unit(S.center.alt, S.center.az);
  let Rv = [F[1], -F[0], 0];
  const rl = Math.hypot(Rv[0], Rv[1]);
  if (rl < 1e-6) Rv = [1, 0, 0]; else Rv = [Rv[0] / rl, Rv[1] / rl, 0];
  const U = [Rv[1] * F[2] - Rv[2] * F[1], Rv[2] * F[0] - Rv[0] * F[2], Rv[0] * F[1] - Rv[1] * F[0]];
  return { mode: "scope", cx: W / 2, cy: H / 2, scale, F, Rv, U };
}

function unit(alt, az) {
  return [cos(alt) * sin(az), cos(alt) * cos(az), sin(alt)];
}

/* returns [x, y, visible, scaleFactor] */
function project(alt, az, v) {
  if (v.mode === "dome") {
    if (alt < -1.5) return null;
    const z = 90 - alt;
    const r = v.R * Math.tan(z / 2 * D2R);
    const a = (az + v.spin) * D2R;
    return [v.cx - r * Math.sin(a), v.cy - r * Math.cos(a), 1];
  }
  const p = unit(alt, az);
  const dp = p[0] * v.F[0] + p[1] * v.F[1] + p[2] * v.F[2];
  if (dp <= 0.05) return null;
  const sx = (p[0] * v.Rv[0] + p[1] * v.Rv[1] + p[2] * v.Rv[2]) / dp;
  const sy = (p[0] * v.U[0] + p[1] * v.U[1] + p[2] * v.U[2]) / dp;
  const x = v.cx + sx * v.scale, y = v.cy - sy * v.scale;
  if (x < -200 || x > W + 200 || y < -200 || y > H + 200) return null;
  return [x, y, 1];
}

/* inverse: screen -> alt/az */
function unproject(x, y, v) {
  if (v.mode === "dome") {
    const dx = x - v.cx, dy = y - v.cy;
    const r = Math.hypot(dx, dy);
    if (r > v.R) return null;
    const z = 2 * Math.atan(r / v.R) * R2D;
    const alt = 90 - z;
    const a = Math.atan2(-dx, -dy) * R2D;
    return { alt, az: rev(a - v.spin) };
  }
  const sx = (x - v.cx) / v.scale, sy = (v.cy - y) / v.scale;
  const d = [
    v.F[0] + sx * v.Rv[0] + sy * v.U[0],
    v.F[1] + sx * v.Rv[1] + sy * v.U[1],
    v.F[2] + sx * v.Rv[2] + sy * v.U[2]
  ];
  const n = Math.hypot(d[0], d[1], d[2]);
  return { alt: Math.asin(d[2] / n) * R2D, az: rev(Math.atan2(d[0], d[1]) * R2D) };
}

/* angular size of one degree at a given point, in px — used to size the Moon and glyphs */
function pxPerDeg(v) {
  return v.mode === "dome" ? v.R / 90 : v.scale * D2R;
}

/* ============================================================
   Drawing
   ============================================================ */
function sprite(rgb, inner) {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(" + rgb + ",1)");
  rg.addColorStop(0.35, "rgba(" + rgb + "," + inner + ")");
  rg.addColorStop(1, "rgba(" + rgb + ",0)");
  g.fillStyle = rg;
  g.fillRect(0, 0, 64, 64);
  return c;
}

const glow = sprite("255,255,255", 0.34);
const haze = sprite("178,196,238", 0.5);   // Milky Way

/* font stacks resolved once — reading them per frame forces layout */
const FONT = {
  sans: getComputedStyle(document.body).fontFamily,
  serif: getComputedStyle(document.querySelector("h1")).fontFamily
};

let hitList = [];

/* Only register a click target where the object is actually visible: the dome
   draws a little past the horizon, but those pixels are clipped away. */
function pushHit(v, x, y, r, obj) {
  if (!isFinite(x) || !isFinite(y)) return;
  if (v.mode === "dome" && Math.hypot(x - v.cx, y - v.cy) > v.R) return;
  if (x < -r || y < -r || x > W + r || y > H + r) return;
  hitList.push({ x, y, r, obj });
}

function draw() {
  const v = view();
  const dark = S.layers.realsky ? darkness(scene.sunAlt) : 1;
  const starVis = S.layers.realsky ? Math.pow(dark, 1.6) : 1;
  const limit = S.limmag - (1 - starVis) * 5;

  hitList = [];
  paintGround(v, dark);

  /* everything celestial lives inside the dome disc */
  ctx.save();
  if (v.mode === "dome") {
    ctx.beginPath();
    ctx.arc(v.cx, v.cy, v.R, 0, TAU);
    ctx.clip();
  }
  if (S.layers.milkyway && starVis > 0.15) drawMilkyWay(v, starVis);
  if (S.layers.grid) drawGrid(v);
  if (S.layers.ecliptic) drawEcliptic(v);
  if (S.layers.lines) drawFigures(v, starVis);
  drawStars(v, limit, starVis);
  if (S.layers.deep) drawDeep(v, limit + 3.4, starVis);
  if (S.layers.planets) drawBodies(v, dark);
  if (S.layers.names) drawLabels(v, starVis);
  ctx.restore();

  drawHorizon(v);
  drawSelection(v);
}

function paintGround(v, dark) {
  /* sky wash keyed to the Sun's real altitude */
  const sa = scene.sunAlt;
  let top, bot;
  if (!S.layers.realsky || sa <= -18) { top = "#04060c"; bot = "#0a0f1c"; }
  else if (sa > 0) { top = "#2f6ba8", bot = "#8fb8d8"; }
  else if (sa > -6) { top = "#12233f", bot = "#8a5f47"; }
  else if (sa > -12) { top = "#080e1e", bot = "#2c3358"; }
  else { top = "#05070f", bot = "#111634"; }

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (v.mode === "dome") {
    /* mask everything outside the dome as ground */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(v.cx, v.cy, v.R, 0, TAU, true);
    ctx.fillStyle = "#05070d";
    ctx.fill("evenodd");
    ctx.restore();
  }
}

function drawMilkyWay(v, vis) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const ppd = pxPerDeg(v);
  for (let l = 0; l < 360; l += 3) {
    /* the core third of the galaxy is far brighter than the anticentre */
    const dl = Math.min(Math.abs(l), 360 - Math.abs(l));
    const coreBoost = 1 + 1.5 * Math.exp(-(dl * dl) / 1800);
    for (let bi = -2; bi <= 2; bi++) {
      const b = bi * 7.5;
      const eq = galToEq(l, b);
      const h = horizontal(eq[0], eq[1], scene.lst, S.lat);
      if (h[0] < -2) continue;
      const p = project(h[0], h[1], v);
      if (!p) continue;
      const fade = Math.exp(-(b * b) / 190);
      const alpha = 0.05 * fade * coreBoost * vis * Math.min(1, (h[0] + 4) / 12);
      if (alpha <= 0.003) continue;
      const rad = ppd * 11;
      ctx.globalAlpha = Math.min(0.2, alpha);
      ctx.drawImage(haze, p[0] - rad, p[1] - rad, rad * 2, rad * 2);
    }
  }
  ctx.restore();
}

function polyline(v, pts) {
  /* trace a sampled curve, lifting the pen where it leaves the view or jumps */
  const maxJump = Math.max(W, H) * 0.6;
  ctx.beginPath();
  let prev = null;
  for (let i = 0; i < pts.length; i++) {
    const p = project(pts[i][0], pts[i][1], v);
    if (!p) { prev = null; continue; }
    if (!prev || Math.hypot(p[0] - prev[0], p[1] - prev[1]) > maxJump) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
    prev = p;
  }
  ctx.stroke();
}

function drawGrid(v) {
  ctx.save();
  ctx.strokeStyle = "rgba(111,168,207,0.16)";
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 4]);
  for (let alt = 0; alt <= 80; alt += 20) {
    const pts = [];
    for (let az = 0; az <= 360; az += 3) pts.push([alt, az]);
    polyline(v, pts);
  }
  ctx.setLineDash([]);
  for (let az = 0; az < 360; az += 30) {
    const pts = [];
    for (let alt = 0; alt <= 89; alt += 3) pts.push([alt, az]);
    ctx.strokeStyle = az % 90 === 0 ? "rgba(111,168,207,0.24)" : "rgba(111,168,207,0.10)";
    polyline(v, pts);
  }
  ctx.restore();
}

function drawEcliptic(v) {
  ctx.save();
  ctx.strokeStyle = "rgba(217,164,65,0.42)";
  ctx.lineWidth = 1.1;
  ctx.setLineDash([6, 5]);
  const pts = [];
  for (let lon = 0; lon <= 360; lon += 2) {
    const eq = eclToEq(lon, 0, scene.obl);
    pts.push(horizontal(eq[0], eq[1], scene.lst, S.lat));
  }
  polyline(v, pts);
  ctx.restore();
}

function drawFigures(v, vis) {
  ctx.save();
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(140,170,225," + (0.30 * vis * S.intro).toFixed(3) + ")";
  ctx.lineCap = "round";
  for (const [, paths] of FIGURES) {
    for (const path of paths) {
      ctx.beginPath();
      let pen = false;
      for (const key of path) {
        const s = starIndex[key];
        if (!s) { pen = false; continue; }
        const h = horizontal(s[2], s[3], scene.lst, S.lat);
        const p = project(h[0], h[1], v);
        if (!p) { pen = false; continue; }
        if (!pen) { ctx.moveTo(p[0], p[1]); pen = true; } else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

function starRadius(mag, limit, zoom) {
  const r = 0.72 + Math.max(0, limit - mag) * 0.46;
  return Math.min(9, r) * zoom;
}

function drawStars(v, limit, vis) {
  const zoom = v.mode === "scope" ? Math.min(2.2, Math.max(0.8, 55 / S.fov)) : 1;
  ctx.save();
  for (const o of scene.objects) {
    if (o.mag > limit + 0.4) continue;
    if (o.alt < -0.6) continue;
    const p = project(o.alt, o.az, v);
    if (!p) continue;

    const introGate = Math.min(1, Math.max(0, S.intro * 3.2 - (o.mag + 1.6) / 4));
    if (introGate <= 0) continue;

    const fade = Math.min(1, (limit + 0.4 - o.mag) / 0.9) * vis * introGate;
    if (fade <= 0.02) continue;

    const c = bvColor(o.bv);
    const r = starRadius(o.mag, limit, zoom);

    if (r > 1.9) {
      ctx.globalAlpha = 0.30 * fade;
      const gr = r * 4.2;
      ctx.drawImage(glow, p[0] - gr, p[1] - gr, gr * 2, gr * 2);
    }
    ctx.globalAlpha = fade;
    ctx.fillStyle = "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
    ctx.beginPath();
    ctx.arc(p[0], p[1], r, 0, TAU);
    ctx.fill();

    pushHit(v, p[0], p[1], Math.max(9, r + 6), o);
  }
  ctx.restore();
}

function drawDeep(v, limit, vis) {
  ctx.save();
  ctx.lineWidth = 1.1;
  for (const o of scene.deep) {
    if (o.alt < 0) continue;
    if (o.mag > limit) continue;
    const p = project(o.alt, o.az, v);
    if (!p) continue;
    const a = 0.62 * vis * S.intro;
    ctx.globalAlpha = a;
    ctx.strokeStyle = "rgba(160,205,235,0.9)";
    const r = 4.5;
    ctx.beginPath();
    if (o.kind === "Galaxy") {
      ctx.ellipse(p[0], p[1], r * 1.5, r * 0.72, -0.5, 0, TAU);
    } else if (o.kind.indexOf("Globular") === 0) {
      ctx.arc(p[0], p[1], r, 0, TAU);
      ctx.moveTo(p[0] - r, p[1]); ctx.lineTo(p[0] + r, p[1]);
      ctx.moveTo(p[0], p[1] - r); ctx.lineTo(p[0], p[1] + r);
    } else if (o.kind === "Nebula" || o.kind === "Planetary nebula") {
      ctx.rect(p[0] - r, p[1] - r, r * 2, r * 2);
    } else {
      ctx.setLineDash([2.5, 2.5]);
      ctx.arc(p[0], p[1], r, 0, TAU);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    pushHit(v, p[0], p[1], 12, o);
  }
  ctx.restore();
}

function drawBodies(v, dark) {
  const ppd = pxPerDeg(v);
  ctx.save();
  for (const b of scene.bodies) {
    if (b.alt < -1) continue;
    const p = project(b.alt, b.az, v);
    if (!p) continue;

    if (b.t === "sun") {
      const r = Math.max(6, ppd * 0.27);
      ctx.globalAlpha = 0.85;
      const gr = r * 9;
      ctx.drawImage(glow, p[0] - gr, p[1] - gr, gr * 2, gr * 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff4d0";
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill();
      pushHit(v, p[0], p[1], r + 8, b);
      continue;
    }

    if (b.t === "moon") {
      const r = Math.max(7, ppd * 0.26);
      ctx.globalAlpha = 0.5;
      const gr = r * 3.4;
      ctx.drawImage(glow, p[0] - gr, p[1] - gr, gr * 2, gr * 2);
      ctx.globalAlpha = 1;
      drawMoon(p[0], p[1], r, b.illum, b.waxing);
      pushHit(v, p[0], p[1], r + 8, b);
      continue;
    }

    const r = Math.max(1.8, 1.5 + Math.max(0, 4.2 - b.mag) * 0.62) * (v.mode === "scope" ? Math.min(2, 55 / S.fov) : 1);
    ctx.globalAlpha = 0.42;
    const gr = r * 5;
    ctx.drawImage(glow, p[0] - gr, p[1] - gr, gr * 2, gr * 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill();

    if (S.layers.names) {
      ctx.globalAlpha = 0.9;
      ctx.font = "600 11px " + FONT.sans;
      ctx.fillStyle = "rgba(232,214,170,0.92)";
      ctx.textAlign = "left";
      ctx.fillText(b.name, p[0] + r + 6, p[1] + 4);
    }
    pushHit(v, p[0], p[1], Math.max(10, r + 7), b);
  }
  ctx.restore();
}

function drawMoon(x, y, r, illum, waxing) {
  const k = 1 - 2 * illum;                 // terminator ellipse half-width factor
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(waxing ? 1 : -1, 1);           // lit limb on the right when waxing

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = "#191d2b";
  ctx.fill();

  if (illum > 0.015) {
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    ctx.ellipse(0, 0, Math.abs(k) * r, r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
    ctx.closePath();
    ctx.fillStyle = "#f2ecdc";
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
}

function drawHorizon(v) {
  const font = FONT.sans;
  ctx.save();
  if (v.mode === "dome") {
    ctx.strokeStyle = "rgba(111,168,207,0.35)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(v.cx, v.cy, v.R, 0, TAU); ctx.stroke();

    ctx.strokeStyle = "rgba(217,164,65,0.30)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(v.cx, v.cy, v.R + 7, 0, TAU); ctx.stroke();

    /* zenith mark */
    ctx.strokeStyle = "rgba(217,164,65,0.34)";
    ctx.beginPath();
    ctx.moveTo(v.cx - 6, v.cy); ctx.lineTo(v.cx + 6, v.cy);
    ctx.moveTo(v.cx, v.cy - 6); ctx.lineTo(v.cx, v.cy + 6);
    ctx.stroke();

    const marks = [["N", 0], ["NE", 45], ["E", 90], ["SE", 135], ["S", 180], ["SW", 225], ["W", 270], ["NW", 315]];
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const [lbl, az] of marks) {
      const a = (az + v.spin) * D2R;
      const rr = v.R + 20;
      const x = v.cx - rr * Math.sin(a), y = v.cy - rr * Math.cos(a);
      const cardinal = lbl.length === 1;
      ctx.fillStyle = cardinal ? "rgba(217,164,65,0.92)" : "rgba(141,149,175,0.7)";
      ctx.font = (cardinal ? "600 13px " : "500 10px ") + font;
      ctx.fillText(lbl, x, y);
    }
    ctx.restore();
    return;
  }

  /* scope: horizon line + ground wash */
  const pts = [];
  for (let az = 0; az <= 360; az += 1.5) {
    const p = project(0, az, v);
    if (p) pts.push(p);
  }
  if (pts.length > 1) {
    pts.sort((a, b) => a[0] - b[0]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(pts[pts.length - 1][0], H + 10);
    ctx.lineTo(pts[0][0], H + 10);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, Math.min(...pts.map(p => p[1])), 0, H);
    g.addColorStop(0, "rgba(5,7,13,0.75)");
    g.addColorStop(1, "rgba(5,7,13,1)");
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.strokeStyle = "rgba(111,168,207,0.45)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  const marks = [["N", 0], ["NE", 45], ["E", 90], ["SE", 135], ["S", 180], ["SW", 225], ["W", 270], ["NW", 315]];
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const [lbl, az] of marks) {
    const p = project(1.5, az, v);
    if (!p) continue;
    const cardinal = lbl.length === 1;
    ctx.fillStyle = cardinal ? "rgba(217,164,65,0.92)" : "rgba(141,149,175,0.65)";
    ctx.font = (cardinal ? "600 13px " : "500 10px ") + font;
    ctx.fillText(lbl, p[0], p[1] - 12);
  }
  ctx.restore();
}

function drawLabels(v, vis) {
  const font = FONT.sans;
  const zoom = v.mode === "scope" ? 55 / S.fov : 1;
  const nameLimit = v.mode === "scope" ? Math.min(4.2, 1.9 + Math.log2(zoom) * 1.6) : 2.15;
  const placed = [];

  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";

  /* constellation names at figure centroids */
  ctx.font = "italic 12px " + FONT.serif;
  ctx.fillStyle = "rgba(141,160,200," + (0.42 * vis * S.intro).toFixed(3) + ")";
  for (const [abbr, paths] of FIGURES) {
    let sx = 0, sy = 0, n = 0, minAlt = 99;
    for (const path of paths) {
      for (const key of path) {
        const s = starIndex[key];
        if (!s) continue;
        const h = horizontal(s[2], s[3], scene.lst, S.lat);
        const p = project(h[0], h[1], v);
        if (!p) continue;
        sx += p[0]; sy += p[1]; n++;
        minAlt = Math.min(minAlt, h[0]);
      }
    }
    if (n < 3 || minAlt < 3) continue;
    const x = sx / n, y = sy / n;
    if (x < 40 || x > W - 40 || y < 30 || y > H - 30) continue;
    ctx.textAlign = "center";
    ctx.fillText((CONST_NAMES[abbr] || abbr).toUpperCase(), x, y);
    placed.push([x, y, 60, 10]);
  }

  /* star proper names */
  ctx.textAlign = "left";
  ctx.font = "500 11px " + font;
  for (const o of scene.objects) {
    if (!o.name || o.mag > nameLimit || o.alt < 1) continue;
    const p = project(o.alt, o.az, v);
    if (!p) continue;
    let clash = false;
    for (const q of placed) {
      if (Math.abs(p[0] - q[0]) < 52 && Math.abs(p[1] - q[1]) < 13) { clash = true; break; }
    }
    if (clash) continue;
    placed.push([p[0] + 30, p[1], 60, 10]);
    ctx.fillStyle = "rgba(216,226,248," + (0.78 * vis * S.intro).toFixed(3) + ")";
    ctx.fillText(o.name, p[0] + 8, p[1] + 1);
  }

  /* deep sky designations */
  if (S.layers.deep) {
    ctx.font = "500 10px " + FONT.sans;
    ctx.fillStyle = "rgba(160,205,235," + (0.6 * vis * S.intro).toFixed(3) + ")";
    for (const o of scene.deep) {
      if (o.alt < 2 || o.mag > S.limmag + 3.4) continue;
      const p = project(o.alt, o.az, v);
      if (!p) continue;
      ctx.fillText(o.name, p[0] + 8, p[1] + 10);
    }
  }
  ctx.restore();
}

function drawSelection(v) {
  const target = S.selected;
  if (!target) return;
  const live = findLive(target);
  if (!live || live.alt < -1) return;
  const p = project(live.alt, live.az, v);
  if (!p) return;
  const t = (performance.now() % 2400) / 2400;
  const r = 14 + Math.sin(t * TAU) * 1.6;
  ctx.save();
  ctx.strokeStyle = "rgba(217,164,65,0.85)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    ctx.moveTo(p[0] + Math.cos(a) * (r - 5), p[1] + Math.sin(a) * (r - 5));
    ctx.lineTo(p[0] + Math.cos(a) * (r + 5), p[1] + Math.sin(a) * (r + 5));
  }
  ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.stroke();
  ctx.restore();
}

function findLive(sel) {
  const all = scene.objects.concat(scene.bodies, scene.deep);
  for (const o of all) {
    if (o.t === sel.t && (o.key || o.name) === (sel.key || sel.name)) return o;
  }
  return null;
}

/* ============================================================
   Dossier
   ============================================================ */
const dossier = document.getElementById("dossier");

function fmtRA(h) {
  const hh = Math.floor(h), m = (h - hh) * 60, mm = Math.floor(m);
  return hh + "h " + String(mm).padStart(2, "0") + "m " + String(Math.round((m - mm) * 60)).padStart(2, "0") + "s";
}

function fmtDec(d) {
  const s = d < 0 ? "−" : "+", a = Math.abs(d);
  const dd = Math.floor(a), m = (a - dd) * 60;
  return s + dd + "° " + String(Math.floor(m)).padStart(2, "0") + "' " + String(Math.round((m - Math.floor(m)) * 60)).padStart(2, "0") + '"';
}

/* scan the next 24h for the next horizon crossing */
function nextCrossing(o) {
  const step = 5 * 60000;
  let prev = o.alt;
  for (let i = 1; i <= 288; i++) {
    const t = S.time + i * step;
    const jd = julian(t), lst = rev(gmst(jd) + S.lon);
    let ra = o.ra, dec = o.dec;
    if (o.t === "planet" || o.t === "moon" || o.t === "sun") {
      const obl = OBL_J2000;
      if (o.t === "sun") { const s = sunPos(jd); const eq = eclToEq(s.lon, s.lat, obl); ra = eq[0]; dec = eq[1]; }
      else if (o.t === "moon") {
        const dd = dayNumber(jd);
        const mp = moonPos(dd, sunOfDate(dd));
        const eq = eclToEq(mp.lon, mp.lat, obl); ra = eq[0]; dec = eq[1];
      } else { const p = planetPos(o.name, jd); const eq = eclToEq(p.lon, p.lat, obl); ra = eq[0]; dec = eq[1]; }
    }
    const alt = horizontal(ra, dec, lst, S.lat)[0];
    if ((prev < 0) !== (alt < 0)) {
      const when = new Date(t - step / 2);
      return (alt >= 0 ? "Rises " : "Sets ") + when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    prev = alt;
  }
  return o.alt >= 0 ? "Circumpolar — never sets" : "Below the horizon all day";
}

const GREEK = {
  al: "α", be: "β", ga: "γ", de: "δ", ep: "ε", ze: "ζ", et: "η", th: "θ", io: "ι", ka: "κ",
  la: "λ", mu: "μ", nu: "ν", xi: "ξ", omi: "ο", pi: "π", ro: "ρ", si: "σ", ta: "τ", up: "υ",
  ph: "φ", ch: "χ", ps: "ψ", om: "ω"
};

function bayer(key) {
  const stem = key.slice(0, -3);
  return (GREEK[stem] || stem) + " " + key.slice(-3);
}

function describe(o) {
  if (o.t === "star") {
    const cn = CONST_NAMES[o.key.slice(-3)] || "";
    return [o.name || bayer(o.key), "Star" + (cn ? " in " + cn : ""),
      o.name ? bayer(o.key) + " — magnitude " + o.mag.toFixed(2) + " as seen from Earth."
             : "Catalogued by its Bayer letter only; no widely used proper name."];
  }
  if (o.t === "planet") return [o.name, "Planet", o.note];
  if (o.t === "sun") return ["Sun", "Star", o.note];
  if (o.t === "moon") return ["Moon", "Satellite", o.note];
  return [o.name, o.kind, o.note];
}

let dsEvent = "";                     // horizon-crossing scan is costly — computed on open only

function openDossier(o) {
  S.selected = { t: o.t, key: o.key, name: o.name };
  dsEvent = nextCrossing(findLive(S.selected) || o);
  renderDossier();
  dossier.classList.add("open");
}

function renderDossier() {
  if (!S.selected) return;
  const live = findLive(S.selected);
  if (!live) return;
  const [name, kind, note] = describe(live);
  $("dsname").textContent = name;
  $("dskind").textContent = kind;

  const up = live.alt >= 0;
  const rows = [
    ["Altitude", live.alt.toFixed(1) + "°"],
    ["Azimuth", live.az.toFixed(1) + "° " + compass(live.az)],
    ["Right asc.", fmtRA(live.ra)],
    ["Declination", fmtDec(live.dec)],
    ["Magnitude", live.t === "sun" ? "−26.7" : live.mag.toFixed(2).replace("-", "−")],
    ["Next event", dsEvent]
  ];
  $("dstable").innerHTML = '<span class="label">Status</span><span class="v"><span class="horizon-chip ' +
    (up ? "chip-up" : "chip-down") + '">' + (up ? "Above horizon" : "Below horizon") + "</span></span>" +
    rows.map(r => '<span class="label">' + r[0] + '</span><span class="v">' + r[1] + "</span>").join("");
  $("dsnote").textContent = note || "";
  $("dsnote").style.display = note ? "" : "none";
}

function compass(az) {
  const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
  return dirs[Math.round(rev(az) / 22.5) % 16];
}

document.getElementById("dsclose").onclick = () => {
  dossier.classList.remove("open");
  S.selected = null;
};

/* ============================================================
   Interaction
   ============================================================ */
let drag = null;
const pointers = new Map();
let pinch = null;

function pinchSpan() {
  const [p, q] = [...pointers.values()];
  return {
    d: Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY),
    x: (p.clientX + q.clientX) / 2,
    y: (p.clientY + q.clientY) / 2
  };
}

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const s = pinchSpan();
    pinch = { d: Math.max(1, s.d), fov: S.fov, x: s.x, y: s.y };
    drag = null;
    cv.classList.remove("dragging");
    return;
  }
  if (pointers.size > 2) return;
  drag = {
    x: e.clientX, y: e.clientY, moved: 0,
    spin: S.spin, alt: S.center.alt, az: S.center.az, head: S.headOffset
  };
  cv.classList.add("dragging");
});

cv.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e);

  if (pinch && pointers.size >= 2) {
    const s = pinchSpan();
    const ratio = pinch.d / Math.max(1, s.d);
    if (S.mode === "dome") {
      /* spreading two fingers on the dome dives into the patch under them */
      if (ratio < 0.75) {
        const r = cv.getBoundingClientRect();
        const aim = unproject(pinch.x - r.left, pinch.y - r.top, view());
        if (aim) { S.center.alt = Math.max(0, Math.min(88, aim.alt)); S.center.az = aim.az; }
        setMode("scope");
        S.fov = 70;
        pinch = { ...pinch, d: Math.max(1, s.d), fov: 70 };
        toast("Scope mode — pinch to zoom, drag to look around");
      }
      return;
    }
    S.fov = Math.max(8, Math.min(120, pinch.fov * ratio));
    return;
  }

  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  if (S.mode === "dome") {
    S.spin = drag.spin + dx * 0.35;
  } else if (S.tilt) {
    /* the sensor keeps the aim; a sideways drag only trims the compass, which is
       routinely a few degrees out indoors or near anything magnetic */
    const k = S.fov / Math.min(W, H);
    S.headOffset = rev(drag.head - dx * k);
    if (!S.tiltNudged && Math.abs(dx) > 24) {
      S.tiltNudged = true;
      toast("Compass trimmed — tap “Stop pointing” for manual control");
    }
  } else {
    const k = S.fov / Math.min(W, H);
    S.center.az = rev(drag.az - dx * k);
    S.center.alt = Math.max(-25, Math.min(89, drag.alt + dy * k));
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
}

cv.addEventListener("pointerup", e => {
  cv.classList.remove("dragging");
  endPointer(e);
  if (drag && drag.moved < 5) pick(e.clientX, e.clientY);
  drag = null;
});

cv.addEventListener("pointercancel", e => {
  endPointer(e);
  drag = null;
  cv.classList.remove("dragging");
});

cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (S.mode === "dome") {
    if (e.deltaY < 0) {
      const v = view();
      const aim = unproject(e.clientX - cv.getBoundingClientRect().left, e.clientY - cv.getBoundingClientRect().top, v);
      if (aim) { S.center.alt = Math.max(0, Math.min(88, aim.alt)); S.center.az = aim.az; }
      setMode("scope");
      S.fov = 70;
      toast("Scope mode — drag to look around, scroll to zoom");
    }
    return;
  }
  S.fov = Math.max(8, Math.min(120, S.fov * (e.deltaY > 0 ? 1.1 : 0.9)));
  if (S.fov > 118) { setMode("dome"); toast("Dome mode — the whole sky at once"); }
}, { passive: false });

function pick(clientX, clientY) {
  const rect = cv.getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;
  let best = null, bestD = 1e9;
  for (const h of hitList) {
    const d = Math.hypot(h.x - x, h.y - y);
    if (d < h.r && d < bestD) { best = h; bestD = d; }
  }
  if (best) openDossier(best.obj);
  else { dossier.classList.remove("open"); S.selected = null; }
}

/* ============================================================
   Point at sky — device orientation
   ============================================================ */

/* World frame is ENU (x east, y north, z up), the frame project() already speaks.
   The W3C rotation matrix R = Rz(alpha)Rx(beta)Ry(gamma) carries device axes into
   it, so its columns are the phone's own axes in ENU. The sky you are pointing at
   is out the *back* of the phone: -Z. */
function deviceBasis(alphaDeg, betaDeg, gammaDeg, screenDeg) {
  const a = alphaDeg * D2R, b = betaDeg * D2R, g = gammaDeg * D2R;
  const cA = Math.cos(a), sA = Math.sin(a);
  const cB = Math.cos(b), sB = Math.sin(b);
  const cG = Math.cos(g), sG = Math.sin(g);

  const X = [cA * cG - sA * sB * sG, cG * sA + cA * sB * sG, -cB * sG];  // phone's right edge
  const Y = [-cB * sA, cA * cB, sB];                                     // phone's top edge
  const Z = [cA * sG + cG * sA * sB, sA * sG - cA * cG * sB, cB * cG];   // out of the screen

  /* the browser has already rotated the page by screenDeg, so the view rotates the
     other way about the sight line to put screen-up back where the eye expects it */
  const s = screenDeg * D2R, cs = Math.cos(s), ss = Math.sin(s);
  return {
    F: [-Z[0], -Z[1], -Z[2]],
    Rv: [X[0] * cs - Y[0] * ss, X[1] * cs - Y[1] * ss, X[2] * cs - Y[2] * ss],
    U: [X[0] * ss + Y[0] * cs, X[1] * ss + Y[1] * cs, X[2] * ss + Y[2] * cs]
  };
}

/* rotate about the vertical, i.e. add degrees to a direction's azimuth */
function spinZ(v, deg) {
  const c = cos(deg), s = sin(deg);
  return [v[0] * c + v[1] * s, v[1] * c - v[0] * s, v[2]];
}

function norm3(v) {
  const n = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / n, v[1] / n, v[2] / n];
}

/* smoothing drags the three axes out of square; square them up again */
function orthonormalize(o) {
  o.F = norm3(o.F);
  const d = o.U[0] * o.F[0] + o.U[1] * o.F[1] + o.U[2] * o.F[2];
  o.U = norm3([o.U[0] - d * o.F[0], o.U[1] - d * o.F[1], o.U[2] - d * o.F[2]]);
  o.Rv = [
    o.F[1] * o.U[2] - o.F[2] * o.U[1],
    o.F[2] * o.U[0] - o.F[0] * o.U[2],
    o.F[0] * o.U[1] - o.F[1] * o.U[0]
  ];
}

/* sensors arrive at their own cadence and jitter by a degree or two; ease toward
   the reading each frame instead, or every star shivers */
function stepTilt(dt) {
  if (!S.tilt || !S.devTarget) return;
  const raw = S.devTarget;
  const t = S.headOffset
    ? { F: spinZ(raw.F, S.headOffset), Rv: spinZ(raw.Rv, S.headOffset), U: spinZ(raw.U, S.headOffset) }
    : raw;
  if (!S.dev) {
    S.dev = { F: t.F.slice(), Rv: t.Rv.slice(), U: t.U.slice() };
  } else {
    const k = 1 - Math.exp(-dt / 70);
    for (const key of ["F", "Rv", "U"]) {
      for (let i = 0; i < 3; i++) S.dev[key][i] += (t[key][i] - S.dev[key][i]) * k;
    }
  }
  orthonormalize(S.dev);
  S.center.alt = Math.asin(Math.max(-1, Math.min(1, S.dev.F[2]))) * R2D;
  S.center.az = rev(Math.atan2(S.dev.F[0], S.dev.F[1]) * R2D);
}

/* Two separate things, and conflating them froze the sky after one reading:
   absStream is whether the deviceorientationabsolute *event* ever fired, which is
   what decides which listener owns the feed; absHeading is whether the numbers are
   referenced to true north. iOS never fires the absolute event, yet its readings
   carry a true heading in webkitCompassHeading — so the one flag went up on the
   first event and the plain listener then ignored every reading after it. */
let tiltAbs = null, tiltRel = null, absStream = false, absHeading = false, warnedRelative = false;
let wakeLock = null;

function screenAngle() {
  const so = screen.orientation;
  if (so && typeof so.angle === "number") return so.angle;
  return typeof window.orientation === "number" ? window.orientation : 0;
}

function tiltButtons() { return [$("btilt"), $("arbtn")].filter(Boolean); }

function syncTiltBtn() {
  tiltButtons().forEach(b => {
    b.setAttribute("aria-pressed", String(S.tilt));
    b.textContent = S.tilt ? "Stop pointing" : "Point at sky";
  });
}

/* the last raw reading is kept so the basis can be rebuilt when the page rotates
   under a phone that is lying still and sending nothing new */
let tiltEvents = 0, tiltStart = 0, tiltWatchdog = false, lastRaw = null;

function readOrientation(ev, absolute) {
  /* iOS keeps true heading on its own property; its alpha is relative to whatever
     way the phone happened to face when the page loaded */
  const wk = ev.webkitCompassHeading;
  const heading = (typeof wk === "number" && !isNaN(wk)) ? 360 - wk : ev.alpha;
  tiltEvents++;
  lastRaw = { a: ev.alpha, b: ev.beta, g: ev.gamma, wk: wk, scr: screenAngle() };
  if (heading == null) return;
  if (absolute || (typeof wk === "number" && !isNaN(wk))) absHeading = true;
  S.devTarget = deviceBasis(heading, ev.beta || 0, ev.gamma || 0, lastRaw.scr);
  if (!absHeading && !warnedRelative) {
    warnedRelative = true;
    toast("No absolute compass here — drag sideways to line the sky up");
  }
}

/* a phone can grant permission and then report nothing at all — Safari does this
   when Motion & Orientation Access is switched off in Settings, and the silence is
   indistinguishable from a sky that simply is not moving */
function tiltWatch(now) {
  if (!S.tilt || tiltWatchdog || tiltEvents || now - tiltStart < 1800) return;
  tiltWatchdog = true;
  toast("No sensor data — check Settings ▸ Apps ▸ Safari ▸ Motion & Orientation Access");
}

function startTilt() {
  absStream = false;
  absHeading = false;
  tiltEvents = 0;
  tiltWatchdog = false;
  lastRaw = null;
  tiltStart = performance.now();
  tiltAbs = ev => { absStream = true; readOrientation(ev, true); };
  /* the plain event is the fallback, and it stands down only once the absolute
     event has proved it is actually firing — never merely because a reading
     happened to be absolute, which is the normal case on iOS */
  tiltRel = ev => { if (!absStream) readOrientation(ev, ev.absolute === true); };
  window.addEventListener("deviceorientationabsolute", tiltAbs, true);
  window.addEventListener("deviceorientation", tiltRel, true);
}

function stopTilt() {
  if (tiltAbs) window.removeEventListener("deviceorientationabsolute", tiltAbs, true);
  if (tiltRel) window.removeEventListener("deviceorientation", tiltRel, true);
  tiltAbs = tiltRel = null;
  S.dev = S.devTarget = null;
}

async function keepAwake(on) {
  try {
    if (on && navigator.wakeLock && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { /* screen will just dim as usual */ }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.tilt) keepAwake(true);
});

/* a phone lying still on its back sends no new readings, so re-derive the basis
   when the page itself turns under it */
function reapplyScreenAngle() {
  if (!S.tilt || !lastRaw) return;
  const wk = lastRaw.wk;
  const heading = (typeof wk === "number" && !isNaN(wk)) ? 360 - wk : lastRaw.a;
  if (heading == null) return;
  lastRaw.scr = screenAngle();
  S.devTarget = deviceBasis(heading, lastRaw.b || 0, lastRaw.g || 0, lastRaw.scr);
}

window.addEventListener("orientationchange", reapplyScreenAngle);
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener("change", reapplyScreenAngle);
}

function setTilt(on) {
  S.tilt = on;
  if (on) startTilt(); else stopTilt();
  keepAwake(on);
  syncTiltBtn();
}

async function toggleTilt() {
  if (S.tilt) { setTilt(false); toast("Back to manual — drag to look around"); return; }
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) { toast("This device has no orientation sensors"); return; }
  if (typeof DOE.requestPermission === "function") {
    try {
      const res = await DOE.requestPermission();
      if (res !== "granted") { toast("Motion access denied — reload the page to be asked again"); return; }
    } catch (e) {
      toast("Motion access needs a tap on a secure (https) page");
      return;
    }
  }
  setMode("scope");
  S.fov = 65;
  S.headOffset = 0;
  S.tiltNudged = false;
  setTilt(true);
  toast("Hold your phone up to the sky. Pinch to zoom, drag to trim the compass.");
}

tiltButtons().forEach(b => { b.onclick = toggleTilt; });

/* ---- search ---- */
const dl = $("objectlist");

  const names = [];

  PLANET_NAMES.forEach(n => names.push(n));
  names.push("Moon", "Sun");

}

$("search").addEventListener("change", () => {
  const q = $("search").value.trim().toLowerCase();
  if (!q) return;
  const all = scene.objects.concat(scene.bodies, scene.deep);
  let hit = all.find(o => (o.name || "").toLowerCase() === q);
  if (!hit) hit = all.find(o => (o.name || "").toLowerCase().startsWith(q));
  if (!hit) {
    /* try a constellation: aim at the centroid of its figure */
    const abbr = Object.keys(CONST_NAMES).find(k => CONST_NAMES[k].toLowerCase() === q);
    const fig = abbr && FIGURES.find(f => f[0] === abbr);
    if (fig) {
      let sa = 0, sx = 0, sy = 0, n = 0;
      for (const path of fig[1]) for (const key of path) {
        const st = starIndex[key];
        if (!st) continue;
        const h = horizontal(st[2], st[3], scene.lst, S.lat);
        sa += h[0]; sx += Math.sin(h[1] * D2R); sy += Math.cos(h[1] * D2R); n++;
      }
      if (n) {
        setMode("scope");
        S.fov = 50;
        if (S.tilt) setTilt(false);
        S.center.alt = Math.max(-10, Math.min(85, sa / n));
        S.center.az = rev(Math.atan2(sx / n, sy / n) * R2D);
        toast(CONST_NAMES[abbr] + (sa / n < 0 ? " is below your horizon right now" : " centred"));
      }
      return;
    }
    toast("No match for “" + $("search").value + "”");
    return;
  }
  setMode("scope");
  S.fov = Math.min(S.fov, 45);
  if (S.tilt) setTilt(false);
  S.center.alt = Math.max(-12, Math.min(88, hit.alt));
  S.center.az = hit.az;
  openDossier(hit);
  if (hit.alt < 0) toast(hit.name + " is below the horizon — " + Math.abs(hit.alt).toFixed(0) + "° down");
});

/* ---- mobile deck ---- */
$("decktoggle").onclick = () => {
  const open = $("deck").classList.toggle("open");
  $("decktoggle").setAttribute("aria-expanded", String(open));
};

/* ---- keyboard ---- */
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("bplay").click(); }
  else if (e.key === "n") $("bnow").click();
  else if (e.key === "d") setMode(S.mode === "dome" ? "scope" : "dome");
  else if (e.key === "Escape") { dossier.classList.remove("open"); S.selected = null; }
  else if (e.key === "ArrowLeft") { if (S.mode === "dome") S.spin += 5; else S.center.az = rev(S.center.az - 4); }
  else if (e.key === "ArrowRight") { if (S.mode === "dome") S.spin -= 5; else S.center.az = rev(S.center.az + 4); }
  else if (e.key === "ArrowUp" && S.mode === "scope") S.center.alt = Math.min(89, S.center.alt + 4);
  else if (e.key === "ArrowDown" && S.mode === "scope") S.center.alt = Math.max(-25, S.center.alt - 4);
});

/* ---- toast ---- */
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3400);
}

/* ============================================================
   Loop
   ============================================================ */
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
S.intro = reduced ? 1 : 0;

let last = performance.now();
let dsTick = 0, dsEventTick = 0;

let errCount = 0;

function frame(now) {
  /* the loop must re-arm even if a frame throws, or the sky freezes for good */
  try {
    const dt = Math.min(120, now - last);
    last = now;
    if (S.playing) S.time += dt * S.rate;
    if (S.intro < 1) S.intro = Math.min(1, S.intro + dt / 1300);

    resize();
    stepTilt(dt);
    tiltWatch(now);
    buildScene();
    draw();
    updateReadout();

    /* keep an open dossier in step with the clock */
    if (S.selected && dossier.classList.contains("open") && now - dsTick > 500) {
      dsTick = now;
      if (now - dsEventTick > 5000) {
        dsEventTick = now;
        const live = findLive(S.selected);
        if (live) dsEvent = nextCrossing(live);
      }
      renderDossier();
    }
  } catch (err) {
    if (errCount++ < 3) console.error("Overhead: frame failed", err);
  }
  requestAnimationFrame(frame);
}

function updateReadout() {
  $("rdplace").textContent = S.place + "  " +
    Math.abs(S.lat).toFixed(2) + "°" + (S.lat >= 0 ? "N" : "S") + ", " +
    Math.abs(S.lon).toFixed(2) + "°" + (S.lon >= 0 ? "E" : "W");
  const d = new Date(S.time);
  $("rdtime").textContent = d.toLocaleString([], {
    year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
  const lstH = scene.lst / 15;
  const hh = Math.floor(lstH), mm = Math.floor((lstH - hh) * 60), ss = Math.round(((lstH - hh) * 60 - mm) * 60);
  $("rdlst").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":" + String(Math.min(59, ss)).padStart(2, "0") + " LST";
  const [txt, col] = phaseLabel(scene.sunAlt);
  $("rdphase").textContent = txt;
  document.querySelector("#skyphase .dot").style.background = col;
}

/* Bootstrap defensively, then start the loop regardless: the loop re-arms itself
   on failure, so a hiccup here must not cost the whole page. */
try {
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  resize();
  setPlace(S.lat, S.lon, S.place);
  buildScene();
} catch (err) {
  console.error("Overhead: start-up failed", err);
}
requestAnimationFrame(frame);

let firstVisit = true;
try { firstVisit = !localStorage.getItem("overhead"); } catch (e) { /* storage blocked */ }
if (firstVisit) {
  setTimeout(() => toast("Drag to spin the sky. Scroll to zoom in. Tap anything to identify it."), 1200);
}
</script>
</body>
</html>
